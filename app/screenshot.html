<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Threshold — screenshot stage</title>
    <style>
      /* A staged desktop for README screenshots. The app itself is rendered
         live in the iframe; only the wallpaper, the neighbouring windows and
         the OS chrome are drawn here. Not part of the shipped bundle. */

      :root {
        color-scheme: dark;
        --ui: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0c0d;
      }

      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        font-family: var(--ui);
      }

      .wallpaper {
        position: absolute;
        inset: 0;
        background: #0e1013 center / cover no-repeat;
      }

      .wallpaper::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(110% 80% at 50% 6%, transparent 42%, rgba(0, 0, 0, 0.38) 100%),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.3));
      }

      .scene-card .wallpaper {
        filter: brightness(0.68) saturate(0.9);
      }

      .scene-settings .wallpaper {
        filter: brightness(0.58) saturate(0.85) blur(1px);
      }

      /* ------------------------------ app windows ---------------------------- */

      .win {
        position: absolute;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 10px;
        background: #17191d;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.6),
          0 2px 8px rgba(0, 0, 0, 0.45);
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        flex: none;
        padding: 0 12px;
        background: #1c1e23;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        color: #9aa1ab;
        font-size: 12px;
      }

      .titlebar .title {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .titlebar .mark {
        width: 10px;
        height: 10px;
        flex: none;
        border-radius: 2px;
        background: #5b616b;
      }

      .controls {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        margin-left: auto;
        color: #7c828c;
      }

      .controls i {
        display: block;
        width: 10px;
        height: 10px;
        position: relative;
        opacity: 0.8;
      }

      .controls .min::before {
        content: "";
        position: absolute;
        left: 0;
        top: 5px;
        width: 10px;
        height: 1px;
        background: currentColor;
      }

      .controls .max::before {
        content: "";
        position: absolute;
        inset: 1px 1px auto 1px;
        height: 8px;
        border: 1px solid currentColor;
      }

      .controls .close::before,
      .controls .close::after {
        content: "";
        position: absolute;
        left: 0;
        top: 5px;
        width: 10px;
        height: 1px;
        background: currentColor;
        transform: rotate(45deg);
      }

      .controls .close::after {
        transform: rotate(-45deg);
      }

      /* editor */

      .tabs {
        display: flex;
        align-items: stretch;
        gap: 1px;
        height: 32px;
        flex: none;
        padding: 0 8px;
        background: #15171a;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font: 11px/1 var(--ui);
        color: #757c86;
      }

      .tabs .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-top: 1px solid transparent;
      }

      .tabs .tab.on {
        background: #1c1f24;
        border-top-color: #5b616b;
        color: #c4c9d1;
      }

      .tabs .tab::before {
        content: "";
        width: 7px;
        height: 7px;
        border: 1px solid currentColor;
        border-radius: 1px;
        opacity: 0.7;
      }

      .code {
        flex: 1;
        margin: 0;
        padding: 14px 18px 16px;
        overflow: hidden;
        counter-reset: line;
        font: 12.5px/1.68 var(--mono);
        color: #b9c0c9;
        white-space: pre;
      }

      .code .l {
        display: block;
      }

      .code .l::before {
        counter-increment: line;
        content: counter(line);
        display: inline-block;
        width: 2.2em;
        margin-right: 1.6em;
        color: #4d535c;
        text-align: right;
        user-select: none;
      }

      .code .kw {
        color: #c792ea;
      }

      .code .fn {
        color: #82aaff;
      }

      .code .ty {
        color: #ffcb6b;
      }

      .code .str {
        color: #c3e88d;
      }

      .code .num {
        color: #f78c6c;
      }

      .code .com {
        color: #5f6670;
        font-style: italic;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 24px;
        flex: none;
        padding: 0 12px;
        background: #15171a;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font: 10.5px/1 var(--ui);
        color: #6f7681;
      }

      .status .push {
        margin-left: auto;
      }

      /* ------------------------------- taskbar ------------------------------- */

      .taskbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        background: rgba(14, 15, 18, 0.78);
        border-top: 1px solid rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(18px);
      }

      .tb-apps {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tb-apps svg {
        width: 17px;
        height: 17px;
        display: block;
      }

      .tb-app,
      .tb-start {
        display: grid;
        place-items: center;
        width: 40px;
        height: 34px;
        border-radius: 6px;
        color: #b7bdc7;
        opacity: 0.78;
      }

      .tb-start {
        color: #cfd5de;
        opacity: 0.9;
      }

      .tb-start svg {
        width: 15px;
        height: 15px;
      }

      .tb-sep {
        width: 1px;
        height: 18px;
        margin: 0 4px;
        background: rgba(255, 255, 255, 0.1);
      }

      .tb-tray {
        position: absolute;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: #aab0ba;
        font: 11px/1.25 var(--ui);
        text-align: right;
      }

      .tb-tray .glyphs {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.7;
      }

      .tb-tray .glyphs svg {
        width: 13px;
        height: 13px;
        display: block;
      }

      /* ------------------------------- settings ------------------------------ */

      .settings-frame {
        position: absolute;
        left: 50%;
        top: calc(50% - 12px);
        transform: translate(-50%, -50%);
        z-index: 8;
        border-radius: 10px;
        overflow: hidden;
        background: #0b0c0d;
        box-shadow:
          0 60px 160px rgba(0, 0, 0, 0.72),
          0 4px 18px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.09);
      }

      .settings-frame .titlebar {
        height: 34px;
        background: #17181c;
        gap: 9px;
        padding: 0 10px 0 12px;
      }

      .settings-frame .app-icon {
        width: 16px;
        height: 16px;
        flex: none;
        border-radius: 3px;
      }

      .settings-frame iframe {
        display: block;
        width: 900px;
        height: 620px;
        border: 0;
        background: #0b0c0d;
      }

      /* the card layer is transparent; the staged desktop shows through it */
      .layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }

      .scene-settings .layer {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="stage"></main>
    <script type="module" src="/src/stage.ts"></script>
  </body>
</html>
