[package]
name = "threshold-core"
version = "0.1.0"
edition = "2021"
description = "Threshold: cue model, scheduler and card layout. No UI, no OS."
license = "MIT"
repository = "https://github.com/mconcepcionb/threshold"
rust-version = "1.90"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
ttf-parser = "0.25"
